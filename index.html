<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Merry Christmas Lara 💝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            height: -webkit-fill-available;
            background: #1a1a2e;
            overscroll-behavior: none;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        /* Full-viewport background (covers iOS safe areas reliably) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 0;
        }

        /* Snowfall */
        .snowflakes {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100dvh) rotate(360deg);
            }
        }

        /* Main content */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
            max-width: 393px;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }

        .greeting {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 14vw, 5rem);
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            margin-bottom: 40px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 107, 107, 0.5); }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.95rem, 4vw, 1.2rem);
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            padding: 0 15px;
        }

        /* Spin Wheel - Elegant Christmas Style */
        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 0 8px rgba(255, 255, 255, 0.1),
                0 0 40px rgba(0, 0, 0, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.1);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: #1a1a2e;
        }

        .wheel svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #fff 0%, #f0e6d3 100%);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .wheel-pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }

        .wheel-pointer svg {
            width: 30px;
            height: 40px;
        }

        .spin-btn {
            margin-top: 30px;
            padding: 16px 36px;
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(139, 0, 0, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(139, 0, 0, 0.5);
        }

        .spin-btn:active {
            transform: translateY(0);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Prize reveal */
        .prize-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .prize-reveal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .prize-text {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 10vw, 4rem);
            color: #fff;
            text-align: center;
            margin-bottom: 15px;
        }

        .prize-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.8rem, 7vw, 3rem);
            color: #c41e3a;
            text-align: center;
            margin-bottom: 35px;
        }

        .prize-link {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(139, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .prize-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(139, 0, 0, 0.5);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Hearts */
        .hearts {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .heart {
            color: #ff6b6b;
            font-size: 1.3rem;
            animation: heartbeat 1s ease-in-out infinite;
        }

        .heart:nth-child(2) { animation-delay: 0.2s; }
        .heart:nth-child(3) { animation-delay: 0.4s; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>

    <div class="container">
        <h1 class="greeting">Merry Christmas</h1>
        <h2 class="name">Lara</h2>
        <p class="message">Spin the wheel for a chance to win a gift! 💝</p>

        <div class="wheel-container">
            <div class="wheel-wrapper">
                <div class="wheel-pointer">
                    <svg viewBox="0 0 30 40">
                        <polygon points="15,40 0,0 30,0" fill="#c41e3a"/>
                        <polygon points="15,35 5,5 25,5" fill="#8b0000"/>
                    </svg>
                </div>
                <div class="wheel" id="wheel">
                    <svg viewBox="0 0 300 300">
                        <defs>
                            <path id="textPath1" d="M 150,150 m -100,0 a 100,100 0 0,1 100,-100" fill="none"/>
                            <path id="textPath2" d="M 150,150 m 0,-100 a 100,100 0 0,1 100,100" fill="none"/>
                            <path id="textPath3" d="M 150,150 m 100,0 a 100,100 0 0,1 -100,100" fill="none"/>
                            <path id="textPath4" d="M 150,150 m 0,100 a 100,100 0 0,1 -100,-100" fill="none"/>
                            <path id="textPath5" d="M 150,150 m -100,0 a 100,100 0 0,0 100,100" fill="none"/>
                            <path id="textPath6" d="M 150,150 m 0,-100 a 100,100 0 0,0 -100,100" fill="none"/>
                        </defs>
                        <!-- Segments -->
                        <path d="M150,150 L150,0 A150,150 0 0,1 279.9,75 Z" fill="#2d5a3d"/>
                        <path d="M150,150 L279.9,75 A150,150 0 0,1 279.9,225 Z" fill="#f5f0e6"/>
                        <path d="M150,150 L279.9,225 A150,150 0 0,1 150,300 Z" fill="#c41e3a"/>
                        <path d="M150,150 L150,300 A150,150 0 0,1 20.1,225 Z" fill="#2d5a3d"/>
                        <path d="M150,150 L20.1,225 A150,150 0 0,1 20.1,75 Z" fill="#f5f0e6"/>
                        <path d="M150,150 L20.1,75 A150,150 0 0,1 150,0 Z" fill="#c41e3a"/>
                        <!-- Divider lines -->
                        <line x1="150" y1="150" x2="150" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <line x1="150" y1="150" x2="279.9" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <line x1="150" y1="150" x2="279.9" y2="225" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <line x1="150" y1="150" x2="150" y2="300" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <line x1="150" y1="150" x2="20.1" y2="225" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <line x1="150" y1="150" x2="20.1" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <!-- Text labels -->
                        <text transform="rotate(-60, 150, 150)" fill="#fff" font-size="11" font-family="Poppins, sans-serif" font-weight="500">
                            <tspan x="155" y="55">£15</tspan>
                        </text>
                        <text transform="rotate(0, 150, 150)" fill="#1a1a2e" font-size="10" font-family="Poppins, sans-serif" font-weight="500">
                            <tspan x="175" y="95">Greggs</tspan>
                            <tspan x="165" y="107">sausage roll</tspan>
                        </text>
                        <text transform="rotate(60, 150, 150)" fill="#fff" font-size="10" font-family="Poppins, sans-serif" font-weight="500">
                            <tspan x="165" y="95">A pedicure</tspan>
                        </text>
                        <text transform="rotate(120, 150, 150)" fill="#fff" font-size="10" font-family="Poppins, sans-serif" font-weight="500">
                            <tspan x="160" y="95">Breakfast</tspan>
                            <tspan x="170" y="107">in bed</tspan>
                        </text>
                        <text transform="rotate(180, 150, 150)" fill="#1a1a2e" font-size="8" font-family="Poppins, sans-serif" font-weight="500">
                            <tspan x="155" y="90">I thought we</tspan>
                            <tspan x="155" y="100">weren't doing</tspan>
                            <tspan x="170" y="110">gifts</tspan>
                        </text>
                        <text transform="rotate(240, 150, 150)" fill="#fff" font-size="10" font-family="Poppins, sans-serif" font-weight="600">
                            <tspan x="157" y="90">Mystery</tspan>
                            <tspan x="165" y="103">Prize ✨</tspan>
                        </text>
                        <!-- Outer ring decoration -->
                        <circle cx="150" cy="150" r="148" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
                    </svg>
                </div>
                <div class="wheel-center">❄️</div>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Spin the Wheel</button>
        </div>
    </div>

    <!-- Prize reveal overlay -->
    <div class="prize-reveal" id="prizeReveal">
        <p class="prize-text">You won!</p>
        <p class="prize-name">A Mystery Prize</p>
        <a href="gift.png" class="prize-link" target="_blank">Open Your Gift</a>
    </div>

    <script>
        // Create snowflakes
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✧', '✦'];
            const count = window.innerWidth < 500 ? 30 : 50;
            
            for (let i = 0; i < count; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 0.8 + 0.4) + 'em';
                snowflake.style.opacity = Math.random() * 0.5 + 0.3;
                snowflake.style.animationDuration = (Math.random() * 5 + 6) + 's';
                snowflake.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(snowflake);
            }
        }

        // Spin wheel - always lands on Mystery Prize
        // SVG wheel: segments are 60° each, starting from top going clockwise
        // Segment order: £15 (330-30°), Greggs (30-90°), Pedicure (90-150°), 
        // Breakfast (150-210°), No gifts (210-270°), Mystery (270-330°)
        // Mystery Prize center is at 300° from top
        let isSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (isSpinning) return;
            
            isSpinning = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = 'Spinning...';

            // Mystery Prize segment is at 270-330° range, center at 300°
            // To land pointer (at top/0°) on this segment, we rotate wheel so 300° is at top
            // That means rotating by (360 - 300) = 60° plus full spins
            const fullSpins = 4 + Math.floor(Math.random() * 2); // 4-5 full spins
            const targetAngle = 300; // Center of Mystery Prize segment
            const variation = (Math.random() - 0.5) * 30; // ±15 degrees for realism
            
            currentRotation += (fullSpins * 360) + (360 - targetAngle) + variation;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Show prize after spin completes
            setTimeout(() => {
                document.getElementById('prizeReveal').classList.add('show');
                createConfetti();
            }, 4200);
        }

        // Create confetti effect - Christmas colors
        function createConfetti() {
            const colors = ['#c41e3a', '#2d5a3d', '#f5f0e6', '#8b0000', '#1e3d2f'];
            const reveal = document.getElementById('prizeReveal');
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.opacity = '1';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s ease-out forwards`;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                reveal.appendChild(confetti);
            }
        }

        // Add confetti animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize
        createSnowflakes();
    </script>
</body>
</html>
