<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Merry Christmas Lara 💝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            height: -webkit-fill-available;
            background: #1a1a2e;
            overscroll-behavior: none;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        /* Full-viewport background (covers iOS safe areas reliably) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 0;
        }

        /* Snowfall */
        .snowflakes {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100dvh) rotate(360deg);
            }
        }

        /* Main content */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
            max-width: 393px;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }

        .greeting {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 14vw, 5rem);
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            margin-bottom: 40px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 107, 107, 0.5); }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.95rem, 4vw, 1.2rem);
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            padding: 0 15px;
        }

        /* Spin Wheel */
        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), 0 0 60px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffd700;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            right: 0;
            transform-origin: bottom left;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wheel-segment span {
            position: absolute;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1a1a2e;
            text-align: center;
            width: 80px;
            transform: rotate(30deg) translateY(-65px);
            line-height: 1.2;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
        }

        .wheel-segment:nth-child(1) { transform: rotate(0deg) skewY(-30deg); background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .wheel-segment:nth-child(2) { transform: rotate(60deg) skewY(-30deg); background: linear-gradient(135deg, #27ae60, #1e8449); }
        .wheel-segment:nth-child(3) { transform: rotate(120deg) skewY(-30deg); background: linear-gradient(135deg, #3498db, #2980b9); }
        .wheel-segment:nth-child(4) { transform: rotate(180deg) skewY(-30deg); background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .wheel-segment:nth-child(5) { transform: rotate(240deg) skewY(-30deg); background: linear-gradient(135deg, #f39c12, #d68910); }
        .wheel-segment:nth-child(6) { transform: rotate(300deg) skewY(-30deg); background: linear-gradient(135deg, #ffd700, #ffed4a); }

        .wheel-segment:nth-child(1) span { transform: rotate(30deg) translateY(-70px); }
        .wheel-segment:nth-child(2) span { transform: rotate(30deg) translateY(-70px); }
        .wheel-segment:nth-child(3) span { transform: rotate(30deg) translateY(-70px); }
        .wheel-segment:nth-child(4) span { transform: rotate(30deg) translateY(-70px); }
        .wheel-segment:nth-child(5) span { transform: rotate(30deg) translateY(-70px); }
        .wheel-segment:nth-child(6) span { transform: rotate(30deg) translateY(-70px); color: #1a1a2e; }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffd700, #f39c12);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffd700;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .spin-btn {
            margin-top: 25px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ffd700 0%, #f39c12 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Prize reveal */
        .prize-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .prize-reveal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .prize-text {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        .prize-name {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .prize-link {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #ffd700 0%, #f39c12 100%);
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .prize-link:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Hearts */
        .hearts {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .heart {
            color: #ff6b6b;
            font-size: 1.3rem;
            animation: heartbeat 1s ease-in-out infinite;
        }

        .heart:nth-child(2) { animation-delay: 0.2s; }
        .heart:nth-child(3) { animation-delay: 0.4s; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>

    <div class="container">
        <h1 class="greeting">Merry Christmas</h1>
        <h2 class="name">Lara</h2>
        <p class="message">Spin the wheel for a chance to win a gift! 💝</p>

        <div class="wheel-container">
            <div class="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="wheel">
                    <div class="wheel-segment"><span>£15</span></div>
                    <div class="wheel-segment"><span>1x Greggs sausage roll</span></div>
                    <div class="wheel-segment"><span>A pedicure</span></div>
                    <div class="wheel-segment"><span>Breakfast in bed</span></div>
                    <div class="wheel-segment"><span>I thought we weren't doing gifts</span></div>
                    <div class="wheel-segment"><span>✨ Mystery Prize ✨</span></div>
                </div>
                <div class="wheel-center">🎄</div>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Spin the Wheel! 🎰</button>
        </div>
    </div>

    <!-- Prize reveal overlay -->
    <div class="prize-reveal" id="prizeReveal">
        <p class="prize-text">🎉 You won! 🎉</p>
        <p class="prize-name">✨ Mystery Prize ✨</p>
        <a href="gift.png" class="prize-link" target="_blank">Claim Your Prize 🎁</a>
    </div>

    <script>
        // Create snowflakes
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✧', '✦'];
            const count = window.innerWidth < 500 ? 30 : 50;
            
            for (let i = 0; i < count; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 0.8 + 0.4) + 'em';
                snowflake.style.opacity = Math.random() * 0.5 + 0.3;
                snowflake.style.animationDuration = (Math.random() * 5 + 6) + 's';
                snowflake.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(snowflake);
            }
        }

        // Spin wheel - always lands on Mystery Prize (segment 6, at 300-360 degrees)
        let isSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (isSpinning) return;
            
            isSpinning = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = 'Spinning... 🎰';

            // Mystery Prize is segment 6 (300-360 deg range)
            // Pointer is at top (0 deg), so we need the segment to be at top
            // Segment 6 center is at 330 deg, so we rotate to land there
            // Add multiple full rotations for drama
            const fullSpins = 5 + Math.floor(Math.random() * 3); // 5-7 full spins
            const targetAngle = 330; // Center of Mystery Prize segment
            const variation = (Math.random() - 0.5) * 40; // ±20 degrees for realism
            
            currentRotation += (fullSpins * 360) + (360 - targetAngle) + variation;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Show prize after spin completes
            setTimeout(() => {
                document.getElementById('prizeReveal').classList.add('show');
                createConfetti();
            }, 4200);
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#ffd700', '#ff6b6b', '#27ae60', '#3498db', '#9b59b6', '#e74c3c'];
            const reveal = document.getElementById('prizeReveal');
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.opacity = '1';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s ease-out forwards`;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                reveal.appendChild(confetti);
            }
        }

        // Add confetti animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize
        createSnowflakes();
    </script>
</body>
</html>
